name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether only Markdown changed
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$RUNNER_TEMP/welcome-baek-ci-files"
          git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" -- > "$changed_files"

          markdown_only=false
          while IFS= read -r -d '' file; do
            case "$file" in
              *.[mM][dD]) markdown_only=true ;;
              *) markdown_only=false; break ;;
            esac
          done < "$changed_files"

          echo "markdown_only=$markdown_only" >> "$GITHUB_OUTPUT"
          if [[ "$markdown_only" == true ]]; then
            echo 'Only Markdown files changed. Build and tests skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v6
        if: steps.changes.outputs.markdown_only != 'true'
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.markdown_only != 'true'
      - run: npm run typecheck
        if: steps.changes.outputs.markdown_only != 'true'
      - run: npm run build
        if: steps.changes.outputs.markdown_only != 'true'
      - run: npm test
        if: steps.changes.outputs.markdown_only != 'true'
