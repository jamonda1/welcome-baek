<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>Welcome Baek</title>
        <style>
            body {
                width: 300px;
                box-sizing: border-box;
                display: grid;
                justify-items: center;
                gap: 6px;
                padding: 18px;
                color: #26313b;
                font: 600 14px system-ui, sans-serif;
                margin: 0;
                background: #f5f5f5;
            }

            .feedback-link {
                justify-self: stretch;
                margin-top: 10px;
                padding: 9px 12px;
                border: 1px solid #c8d9e7;
                border-radius: 4px;
                background: #fff;
                color: #0066a1;
                text-align: center;
                text-decoration: none;
            }

            .feedback-link:hover {
                background: #edf5fb;
            }

            .feedback-link:focus-visible {
                outline: 2px solid #0076c0;
                outline-offset: 2px;
            }
        </style>
    </head>
    <body>
        <img src="/icons/welcome-baek-128.png" width="72" height="72" alt="" />
        <span>Welcome Baek</span>
        <a
            class="feedback-link"
            href="https://github.com/jamonda1/welcome-baek/issues/new/choose"
            target="_blank"
            rel="noopener noreferrer"
        >버그 신고 및 기능 제안</a>
    </body>
</html>
